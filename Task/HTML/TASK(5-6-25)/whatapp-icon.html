<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whatappp-Icon-position</title>
    <style>
        body{
            display:flex;
            background-color:rgb(253, 181, 181);
        }
        .image{
            
            position:absolute;
            bottom:0;
            right:0;
            
        }
        .image img{
             height:100px;
              width:100px;
        }
         .main-content {
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .large-bell-container {
      position: relative;
      width: 100px;
      height: 100px;
    }

    .large-bell-container img {
      width: 100%;
      height: 100%;
    }

    .large-bell-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background-color: #f44336;
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
    }
    </style>
</head>
<body>
   <div class="main-content image">
    <div class="large-bell-container">
      <img src="./whatsapp.png" alt="Large Notification Bell" />
      <div class="large-bell-badge">3</div>
    </div>
  </div>
</body>
</html>
