<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Landing Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./Headphone-design.css">
</head>
<body>
  <div class="container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="logo"><img src="./letter-n.png" alt="N" class="letter-n"> nitec.</div>
      <div class="search-bar">
        <input type="text" placeholder="Search products..." >
        <img src="./Icon/search.png" alt="">
      </div>
      <div class="profile">
        <span class="heart">❤️</span>
        <span>Ryman Alex</span>
        <img src="./boy img.jpg" style="border-radius: 50%; width: 20px;">
      </div>
    </div>

    <!-- Main Section -->
    <div class="main-section">
      <div class="left">
        <div>
          <small>🎵 Music is Classic</small>
          <h1>Sequoia Inspiring Musico.</h1>
          <p>Clear Sounds - Making your dream music come true. Stay with Sequoia Sounds!</p>
          <button>View All Products</button>
        </div>
        <div>
          <img src="./headphone.jpg" alt="Blue Headphone" style="max-width: 300px;">
        </div>
      </div>
      <div class="right">
        <div>
          <strong>Popular Colors</strong>
          <div class="popular-colors">
            <span class="color-circle red"><img src="./Icon/Red.png" alt=""></span>
            <span class="color-circle green"><img src="./Icon/green.png" alt=""></span>
            <span class="color-circle blue"><img src="./Icon/Blue.png" alt=""></span>
            <span class="color-circle orange"><img src="./Icon/Orange.png" alt=""></span>
            <span class="color-circle cyan"><img src="./Icon/Cyan.jpg" alt=""></span>
          </div>
        </div>
        <img src="./Airpods.jpg" alt="New Gen X-Bud">
        <img src="./VR-heading.jpg" alt="VR Headset">
      </div>
    </div>

    <!-- Footer Section -->
    <div class="footer">
      <div class="box">
        <p>More Products</p>
        <small>460+ items</small>
      </div>
      <div class="box">
        <p>5M+ Downloads</p>
        <small>⭐⭐⭐⭐⭐</small>
      </div>
      <div class="box">
        <p>New Headphones Released</p>
        <small>Top Picks</small>
      </div>
      <div class="box">
        <p>Boosted Bass</p>
        <small>Best Audio Experience</small>
      </div>
    </div>
  </div>
</body>
</html>
