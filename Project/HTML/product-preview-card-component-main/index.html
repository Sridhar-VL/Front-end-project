<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Product Preview Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <link rel="icon" href="./perfume.png">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: hsl(30, 38%, 92%);
      min-height: 100vh;
      font-family: "Montserrat", sans-serif;
    }

    .Container {
      display: flex;
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      max-width: 560px;
      margin: 20px;
    }

    .img-div img {
      height: 100%;
      width: 100%;
      object-fit: cover;
    }

    .Content-div {
      padding: 24px;
    }

    .perfum {
      color: hsl(228, 12%, 48%);
      letter-spacing: 0.4em;
      font-size: 12px;
      font-weight: 500;
    }

    .Perfum-Name {
      font-family: "Fraunces", serif;
      font-size: 28px;
      font-weight: 700;
      margin: 16px 0;
      width: 180px;
    }

    p {
      color: gray;
      font-size: 14px;
      margin-bottom: 20px;
      width:240px;
    }

    h1 {
      color: hsl(158, 36%, 37%);
      font-family: "Fraunces", serif;
      font-size: 28px;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    h1 span {
      font-size: 14px;
      color: gray;
      text-decoration: line-through;
      font-weight: 400;
    }

    button {
      background-color: hsl(158, 36%, 37%);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
    }

    button:hover {
      background-color: hsl(158, 36%, 25%);
    }

    /*Mobile Responsive*/
    @media (max-width: 600px) {
      .Container {
        flex-direction: column;
        max-width: 90%;
      }

      .img-div img {
        height: 250px;
        border-radius: 10px 10px 0 0;
      }

      .Content-div {
        padding: 20px;
      }

      .Perfum-Name {
        font-size: 22px;
      }

      h1 {
        font-size: 24px;
      }

      h1 span {
        font-size: 12px;
      }

      button {
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>

<div class="Container">
  <div class="img-div">
    <img src="./images/image-product-desktop.jpg" alt="Perfume">
  </div>
  <div class="Content-div">
    <h6 class="perfum">PERFUME</h6>
    <h2 class="Perfum-Name">Gabrielle Essence Eau De Parfum</h2>
    <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.</p>
    <h1>$149.99 <span>$169.99</span></h1>
    <button><img src="./images/icon-cart.svg" alt=""> Add to Cart</button>
  </div>
</div>

</body>
</html>
