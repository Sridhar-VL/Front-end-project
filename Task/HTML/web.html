<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navigation Web Page</title>
  <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #fff;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 50px;
      font-weight: bold;
      color: #000;
      margin-left: 0;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: #777;
      font-size: 14px;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #000;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      padding: 20px;
    }

    .image,
    .image2 {
      width: 100%;
      height: 85%;
      object-fit: cover;
    }

    .bottom {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
    }

    .images {
      width: 100%;
      max-width: 480px;
      height: auto;
      object-fit: cover;
      flex: 1 1 300px;
    }

    
    @media (max-width: 1024px) {
      .logo {
        font-size: 40px;
      }

      .nav-links a {
        font-size: 13px;
      }
    }

   
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .logo {
        margin-left: 0;
      }

      .nav-links {
        flex-direction: column;
        gap: 10px;
      }

      .container {
        grid-template-columns: 1fr;
      }

      .bottom {
        flex-direction: column;
      }

      .images {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">W.</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">New</a>
      <a href="#">Popular</a>
      <a href="#">Trending</a>
      <a href="#">Categories</a>
    </div>
  </nav>

  <div class="container">
    <img src="../Table-with-image/img/IMG_0602.jpg" class="image" alt="Future 1">
    <img src="../HTML/Amazon-Bookstore/Atomic Habits.jpg" class="image2" alt="Future 2">
  </div>
  <div class="bottom">
    <img src="../HTML/Amazon-Bookstore/The Magic of Thinking Big.jpg" class="images" alt="Bottom 1">
    <img src="../Restaurant/Restaurant.jpg" class="images" alt="Bottom 2">
    <img src="../Table-with-image/img/IMG_3838.jpg" class="images" alt="Bottom 3">
  </div>

</body>
</html>
