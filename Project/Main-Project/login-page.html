<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Memory Card Game</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* Calm blue animated background */
body {
    font-family: serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffffff;
    background: linear-gradient(-45deg, #0a2540, #102f5e, #0d1b2a, #1b3b6f);
    background-size: 400% 400%;
    animation: bgFlow 18s ease infinite;
}

/* Login container */
.login-box {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(8px);
    padding: 28px;
    border-radius: 14px;
    width: 90%;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    animation: fadeUp 1s ease;
}

/* Heading */
.login-box h1 {
    margin-bottom: 18px;
    font-weight: 500;
    color: #ffffff;
}

/* Input field */
input {
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border-radius: 8px;
    border: none;
    font-size: 16px;
    outline: none;
}

/* Soft focus highlight */
input:focus {
    box-shadow: 0 0 8px rgba(100, 170, 255, 0.6);
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #1e90ff;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.4s ease, transform 0.3s ease;
}

/* Gentle hover effect */
button:hover {
    background: #3fa9f5;
    transform: translateY(-2px);
}

/* Best score text */
.best-score {
    margin-top: 16px;
    font-size: 15px;
    color: #d6e6ff;
    animation: fadeIn 2s ease;
}

/* Animations */
@keyframes bgFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Responsive */
@media (max-width: 480px) {
    .login-box {
        padding: 22px;
    }
    input, button {
        font-size: 14px;
    }
}
</style>

</head>

<body>

<div class="login-box">
    <h1>Memory Card Game</h1>

    <input type="text" id="playerName" placeholder="Enter your name">

    <button onclick="login()">Start Game</button>

    <div id="bestScoreDisplay" class="best-score"></div>
</div>

<script>
window.onload = function () {
    let savedUser = localStorage.getItem("playerName");
    let bestScore = localStorage.getItem("bestScore");

    if (savedUser) {
        document.getElementById("playerName").value = savedUser;

        if (bestScore) {
            document.getElementById("bestScoreDisplay").innerText =
                `Welcome back, ${savedUser}! 🏆 Best Score: ${bestScore} moves`;
        } else {
            document.getElementById("bestScoreDisplay").innerText =
                `Welcome back, ${savedUser}! Start your first game 🎮`;
        }
    }
};

function login() {
    let username = document.getElementById("playerName").value.trim();

    if (username === "") {
        alert("Please enter your name.");
        return;
    }

    localStorage.setItem("playerName", username);
    window.location.href = "index.html";
}
</script>

</body>
</html>
