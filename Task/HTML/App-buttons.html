<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Famous Button Styles</title>
  <link rel="stylesheet" href="../CSS/button-style.css">
</head>
<body>
  <h3>3a. Uber</h3>
  <button class="uber">Request now</button>

  <h3>3b. Amazon</h3>
  <button class="amazon">Add to Cart</button>

  <h3>3c. GitHub</h3>
  <button class="github">Sign up</button>

  <h3>3d. Bootstrap</h3>
  <button class="bootstrap">Get started</button>
  <button class="bootstrap-outline">Download</button>

  <h3>3e. LinkedIn</h3>
  <button class="linkedin">Apply on company website</button>
  <button class="linkedin-outline">Save</button>
</body>
</html>
